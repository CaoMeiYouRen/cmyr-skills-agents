name: Run TODO to Issue
on:
  push:
    branches:
      - master
# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      issues: write
      contents: read
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: "TODO to Issue"
        uses: "alstr/todo-to-issue-action@v5"
        with:
          # 模板与提案中的「项目填充」是占位符，不是可执行任务；不要为它们建 issue
          IGNORE: "global/AGENTS\\.template\\.md,standards/,docs/proposals/"
