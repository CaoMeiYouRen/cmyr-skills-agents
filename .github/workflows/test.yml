name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:md:check
      - run: pnpm run test
      - run: node scripts/verify-manifest.mjs
      - run: node scripts/check-proposals.mjs
      - name: Check placeholders
        run: |
          if grep -rn "TODO" standards global/AGENTS.template.md docs/proposals; then
            echo "模板与提案中不得使用 TODO 占位符；改用「项目填充」，避免 todo-to-issue 误建 issue"
            exit 1
          fi
